plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.myobluenative'
version = '0.1.0'

android {
  namespace "expo.modules.myobluenative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

// Huawei Wear Engine (experimental Huawei watch bridge). The repo is also added to the app's
// build.gradle by plugins/withHuaweiMaven.js.
repositories {
  maven { url 'https://developer.huawei.com/repo/' }
}

dependencies {
  implementation 'com.huawei.hms:wearengine:5.0.3.300'
}
